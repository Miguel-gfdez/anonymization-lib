[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymization-lib"
version = "1.0.0"
description = "Library for data anonymization with Spark"
authors = [{ name = "Miguel" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.2",
    "plotly==5.24.1",
    "pyspark==4.0.2",
    "nbformat==5.10.4",
    "pyarrow==18.1.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
